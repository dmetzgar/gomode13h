- title: "Star Trek: 25th Anniversary"
  year: 1992
  developer: Interplay
  confirmed: false
  research: >-
    320x200 in 256 colours, and reportedly supported MCGA, which cannot do unchained modes.
    Likely 13h, but no source names the mode. Check in the DOSBox debugger.

- title: "Heretic"
  year: 1994
  developer: Raven Software
  confirmed: false
  research: >-
    Doom engine, but recalled as writing to plain mode 13h instead of Doom's unchained mode.
    Check i_ibm.c in the released source.

- title: "Wolfenstein 3D"
  year: 1992
  developer: id Software
  confirmed: false
  research: >-
    Probably does not belong. Recalled as setting mode 13h and then unchaining it
    (planar 320x200 with page flipping), with no option for plain 13h.
    Check VL_SetVGAPlaneMode in the released source.

- title: "Doom"
  year: 1993
  developer: id Software
  confirmed: false
  research: >-
    Probably does not belong. Recalled as setting mode 13h and then unchaining it,
    rendering to a RAM buffer and copying into planar pages, with no option for plain 13h.
    Check I_InitGraphics in the released source.

- title: "Epic Pinball"
  year: 1993
  developer: Digital Extremes
  confirmed: false
  research: >-
    Probably does not belong. Recalled as a Mode X game (320x240, hardware-scrolled tables).
    Check the screen height in DOSBox: 240 lines rules out 13h.

- title: "Jazz Jackrabbit"
  year: 1994
  developer: Epic MegaGames
  confirmed: false
  research: >-
    Unsure, leaning towards does not belong. 320x200 in 256 colours, but the fast smooth
    scrolling suggests an unchained mode with hardware scrolling. Check in the DOSBox debugger.
